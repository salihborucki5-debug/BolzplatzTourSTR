<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Team Anmeldung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fcfbf7] text-gray-900 min-h-screen p-4 flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl border border-stone-200 shadow-xl space-y-6">
    <header class="text-center">
      <h1 class="text-2xl font-black text-pink-500 uppercase tracking-wider">⚽ Team Anmeldung</h1>
      <p class="text-stone-500 text-xs mt-1">32 Teams Gesamt (24 Herren, 8 Damen)</p>
    </header>

    <form id="regForm" onsubmit="registerTeam(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Kategorie</label>
        <select id="category" required class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500 font-bold">
          <option value="M">🚹 Herren (M1 - M24)</option>
          <option value="F">🚺 Damen (F1 - F8)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Teamname / Wunschname</label>
        <input type="text" id="teamName" required placeholder="z.B. Bolzplatz Kings" class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Kapitän / Kontakt</label>
        <input type="text" id="captainInfo" required placeholder="Name & Handynummer" class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500">
      </div>

      <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-3 rounded-xl text-sm transition-all shadow-md cursor-pointer">
        🚀 Jetzt Anmelden
      </button>
    </form>

    <div id="statusMsg" class="text-center text-xs font-bold hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function registerTeam(e) {
      e.preventDefault();
      const msg = document.getElementById('statusMsg');
      msg.className = "text-center text-xs font-bold text-stone-500 block";
      msg.innerText = "Speichere Team...";

      const category = document.getElementById('category').value;
      const rawName = document.getElementById('teamName').value.trim();
      const captain = document.getElementById('captainInfo').value.trim();

      // Anzahl der bisherigen Teams der Kategorie zählen
      const { data: existingTeams } = await db.from('teams').select('team_name').like('team_name', `${category}%`);
      
      const count = (existingTeams ? existingTeams.length : 0) + 1;
      const limit = category === 'M' ? 24 : 8;

      if (count > limit) {
        msg.className = "text-center text-xs font-bold text-rose-600 block";
        msg.innerText = `❌ Leider sind alle ${limit} Plätze für ${category === 'M' ? 'Herren' : 'Damen'} bereits belegt!`;
        return;
      }

      // Format: M1 - Teamname
      const formattedName = `${category}${count} - ${rawName}`;

      const { error } = await db.from('teams').insert([{
        team_name: formattedName,
        captain_info: captain,
        checked_in: true
      }]);

      if (error) {
        msg.className = "text-center text-xs font-bold text-rose-600 block";
        msg.innerText = "Fehler bei der Anmeldung: " + error.message;
      } else {
        msg.className = "text-center text-xs font-bold text-emerald-600 block";
        msg.innerText = `✅ Erfolgreich als ${category}${count} angemeldet!`;
        document.getElementById('regForm').reset();
      }
    }
  </script>
</body>
</html>
