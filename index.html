<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Team Anmeldung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fcfbf7] text-gray-900 min-h-screen p-4 flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl border border-stone-200 shadow-xl space-y-6">
    <header class="text-center">
      <h1 class="text-2xl font-black text-pink-500 uppercase tracking-wider">BOLZPLATZTOUR STR</h1>
      <p class="text-stone-500 text-xs mt-1">BolzplatzTour STR</p>
    </header>

    <form id="regForm" onsubmit="registerTeam(event)" class="space-y-4">
      
      <!-- KATEGORIE SELEKTION -->
      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Turnier-Kategorie</label>
        <select id="category" required class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500 font-bold bg-stone-50">
          <option value="M">Männer</option>
          <option value="F">Frauen</option>
        </select>
      </div>

      <!-- KAPITÄN NAME -->
      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Name des Kapitäns</label>
        <input type="text" id="captainName" required placeholder="Vor- und Nachname" class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500">
      </div>

      <!-- EMAIL -->
      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">E-Mail-Adresse</label>
        <input type="email" id="email" required placeholder="deine@email.de" class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500">
      </div>

      <!-- ALTERSAUSWAHL -->
      <div>
        <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Alter des Kapitäns / Teams</label>
        <select id="ageCheck" onchange="toggleMuttizettel()" required class="w-full p-3 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-pink-500 font-bold">
          <option value="over18">Über 18 Jahre</option>
          <option value="under18">Unter 18 Jahre</option>
        </select>
      </div>

      <!-- MUTTIZETTEL CONTAINER WITH LINK -->
      <div id="muttizettelBox" class="hidden bg-amber-50 p-4 rounded-xl border border-amber-200 text-xs space-y-2">
        <p class="font-bold text-amber-800">📄 Muttizettel / Einverständniserklärung erforderlich!</p>
        <p class="text-amber-700">Da du/dein Team unter 18 Jahre alt seid, müsst ihr den Muttizettel euren Eltern vorlegen und diese müssen den Akzeptieren.</p>
        <p>
          👉 <a href="muttizettel.pdf" target="_blank" class="font-bold underline text-pink-600 hover:text-pink-700">Hier Muttizettel als PDF herunterladen</a>
        </p>
        <label class="flex items-start gap-2 cursor-pointer font-bold text-amber-900 mt-2">
          <input type="checkbox" id="muttizettelCheck" class="w-4 h-4 mt-0.5 accent-pink-500 rounded">
          <span>Ich bestätige, dass die Erziehungsberechtigten aller unter 18-jährigen Teammitglieder den Muttizettel erhalten, gelesen und ausdrücklich akzeptiert haben.
</span>
        </label>
      </div>

      <!-- AGB CHECKBOX WITH LINK -->
      <div class="pt-2">
        <label class="flex items-start gap-2 cursor-pointer text-xs font-medium text-stone-600">
          <input type="checkbox" id="agbCheck" required class="w-4 h-4 mt-0.5 accent-pink-500 rounded">
          <span>
            Ich habe die <a href="agb.pdf" target="_blank" class="font-bold underline text-pink-500 hover:text-pink-600">AGB & Teilnahmebedingungen (PDF)</a> gelesen und akzeptiere diese sowie die Regeln der BolzplatzTour STR.
          </span>
        </label>
      </div>

      <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-3 rounded-xl text-sm transition-all shadow-md cursor-pointer">
        Anmelden
      </button>
    </form>

    <div id="statusMsg" class="text-center text-xs font-bold hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function toggleMuttizettel() {
      const age = document.getElementById('ageCheck').value;
      const box = document.getElementById('muttizettelBox');
      const check = document.getElementById('muttizettelCheck');

      if (age === 'under18') {
        box.classList.remove('hidden');
        check.required = true;
      } else {
        box.classList.add('hidden');
        check.required = false;
        check.checked = false;
      }
    }

    async function registerTeam(e) {
      e.preventDefault();
      const msg = document.getElementById('statusMsg');
      msg.className = "text-center text-xs font-bold text-stone-500 block";
      msg.innerText = "Team wird registriert...";

      const category = document.getElementById('category').value;
      const captain = document.getElementById('captainName').value.trim();
      const email = document.getElementById('email').value.trim();
      const age = document.getElementById('ageCheck').value;

      const { data: existingTeams, error: countErr } = await db
        .from('teams')
        .select('team_name')
        .like('team_name', `${category}%`);

      if (countErr) {
        msg.className = "text-center text-xs font-bold text-rose-600 block";
        msg.innerText = "Fehler bei der Abfrage: " + countErr.message;
        return;
      }

      const count = (existingTeams ? existingTeams.length : 0) + 1;
      const limit = category === 'M' ? 24 : 8;

      if (count > limit) {
        msg.className = "text-center text-xs font-bold text-rose-600 block";
        msg.innerText = `❌ Leider sind bereits alle ${limit} Plätze für ${category === 'M' ? 'Herren' : 'Frauen'} belegt!`;
        return;
      }

      const generatedTeamName = `${category}${count}`;

      const { error } = await db.from('teams').insert([{
        team_name: generatedTeamName,
        captain_info: `${captain} (${email}) - ${age === 'under18' ? 'U18' : 'Ü18'}`,
        checked_in: true
      }]);

      if (error) {
        msg.className = "text-center text-xs font-bold text-rose-600 block";
        msg.innerText = "Fehler bei der Anmeldung: " + error.message;
      } else {
        msg.className = "text-center text-xs font-bold text-emerald-600 block bg-emerald-50 p-3 rounded-xl border border-emerald-200";
        msg.innerText = `🎉 Anmelden erfolgreich! Euer automatischer Teamname lautet: ${generatedTeamName}`;
        document.getElementById('regForm').reset();
        toggleMuttizettel();
      }
    }
  </script>
</body>
</html>
