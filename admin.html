<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Admin Check-in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-black text-green-400">📲 Admin QR-Scanner</h1>
      <p class="text-gray-400 text-xs mt-1">Check-in am Turniertag</p>
    </header>

    <!-- KAMERA-START BUTTON -->
    <div id="startBox" class="text-center mb-6">
      <button onclick="startScanner()" class="w-full bg-green-500 hover:bg-green-600 text-black font-extrabold py-3 rounded-xl transition-all">
        📷 Kamera öffnen & scannen
      </button>
    </div>

    <!-- KAMERA-SCANNER -->
    <div id="reader" class="overflow-hidden rounded-xl border-2 border-green-500 bg-black mb-6 hidden"></div>

    <!-- ANZEIGE/STATUS -->
    <div id="statusResult" class="hidden p-4 rounded-xl text-center space-y-2 mb-6">
      <h2 id="resultTitle" class="text-xl font-bold"></h2>
      <p id="resultDetails" class="text-sm text-gray-300"></p>
      <button onclick="resetScanner()" class="mt-3 bg-gray-700 hover:bg-gray-600 text-white text-xs px-4 py-2 rounded-lg font-bold">
        Nächstes Team scannen
      </button>
    </div>

    <!-- LIVE-LISTE DER TEAMS -->
    <div class="mt-4">
      <h3 class="text-sm font-bold uppercase text-gray-400 mb-3">Angemeldete Teams</h3>
      <ul id="teamList" class="space-y-2 max-h-60 overflow-y-auto">
        <li class="text-xs text-gray-500">Lade Teams...</li>
      </ul>
    </div>
  </div>

  <script>
    // ⚠️ TRAGE HIER DEINE SUPABASE-DATEN EIN! ⚠️
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let html5QrcodeScanner;

    async function onScanSuccess(decodedText) {
      if (html5QrcodeScanner) {
        await html5QrcodeScanner.clear();
      }
      document.getElementById('reader').classList.add('hidden');

      const { data, error } = await supabase
        .from('teams')
        .update({ checked_in: true })
        .eq('team_code', decodedText)
        .select();

      const resultBox = document.getElementById('statusResult');
      resultBox.classList.remove('hidden');

      if (error || !data || data.length === 0) {
        resultBox.className = "p-4 rounded-xl text-center bg-red-900/50 border border-red-500 text-red-200";
        document.getElementById('resultTitle').innerText = "❌ Team nicht gefunden!";
        document.getElementById('resultDetails').innerText = "Code: " + decodedText;
      } else {
        const team = data[0];
        resultBox.className = "p-4 rounded-xl text-center bg-green-900/50 border border-green-500 text-green-200";
        document.getElementById('resultTitle').innerText = "🟢 Check-in Erfolgreich!";
        document.getElementById('resultDetails').innerText = `${team.team_name} (${team.player_count} Spieler)`;
        
        if (team.has_underage) {
          document.getElementById('resultDetails').innerText += " | ⚠️ Achtung: U18!";
        }
      }

      loadTeams();
    }

    function resetScanner() {
      document.getElementById('statusResult').classList.add('hidden');
      document.getElementById('startBox').classList.remove('hidden');
    }

    function startScanner() {
      document.getElementById('startBox').classList.add('hidden');
      document.getElementById('reader').classList.remove('hidden');
      
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess);
    }

    async function loadTeams() {
      const { data: teams } = await supabase.from('teams').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('teamList');
      
      if (!teams || teams.length === 0) {
        list.innerHTML = '<li class="text-xs text-gray-500">Noch keine Teams vorhanden.</li>';
        return;
      }

      list.innerHTML = teams.map(t => `
        <li class="p-3 bg-gray-700/50 rounded-lg border border-gray-600 flex justify-between items-center text-xs">
          <div>
            <span class="font-bold text-white">${t.team_name}</span> 
            <span class="text-gray-400">(${t.team_code})</span>
          </div>
          <span class="${t.checked_in ? 'text-green-400 font-bold' : 'text-gray-400'}">
            ${t.checked_in ? '🟢 Anwesend' : '🔴 Nicht da'}
          </span>
        </li>
      `).join('');
    }

    loadTeams();
  </script>
</body>
</html>
