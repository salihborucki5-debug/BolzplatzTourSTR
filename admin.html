<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Laptop Check-in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex flex-col items-center">

  <div class="max-w-lg w-full bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-black text-green-400">💻 Laptop Check-In Station</h1>
      <p class="text-gray-400 text-xs mt-1">USB-Scanner anschließen & Code einlesen</p>
    </header>

    <!-- AUTOMATISCHES SCAN-FELD -->
    <form id="scanForm" onsubmit="handleScan(event)" class="mb-6">
      <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Scanner-Eingabe (oder Code tippen):</label>
      <input type="text" id="codeInput" autofocus placeholder="Hier reinklicken & scannen..." 
        class="w-full bg-gray-900 border-2 border-green-500 rounded-xl px-4 py-3 text-lg font-mono text-center focus:outline-none focus:ring-2 focus:ring-green-400">
    </form>

    <!-- STATUS/ERGEBNIS -->
    <div id="statusResult" class="hidden p-4 rounded-xl text-center space-y-2 mb-6">
      <h2 id="resultTitle" class="text-xl font-bold"></h2>
      <p id="resultDetails" class="text-sm text-gray-300"></p>
    </div>

    <!-- LIVE-LISTE DER TEAMS -->
    <div>
      <h3 class="text-sm font-bold uppercase text-gray-400 mb-3">Angemeldete Teams</h3>
      <ul id="teamList" class="space-y-2 max-h-60 overflow-y-auto">
        <li class="text-xs text-gray-500">Lade Teams...</li>
      </ul>
    </div>
  </div>

  <script>
    // ⚠️ TRAGE HIER DEINE SUPABASE-DATEN EIN! ⚠️
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleScan(e) {
      e.preventDefault();
      const input = document.getElementById('codeInput');
      const code = input.value.trim();
      if (!code) return;

      // Check-in in Supabase durchführen
      const { data, error } = await supabase
        .from('teams')
        .update({ checked_in: true })
        .eq('team_code', code)
        .select();

      const resultBox = document.getElementById('statusResult');
      resultBox.classList.remove('hidden');

      if (error || !data || data.length === 0) {
        resultBox.className = "p-4 rounded-xl text-center bg-red-900/50 border border-red-500 text-red-200 animate-pulse";
        document.getElementById('resultTitle').innerText = "❌ Code ungültig!";
        document.getElementById('resultDetails').innerText = "Kein Team mit Code: " + code;
      } else {
        const team = data[0];
        resultBox.className = "p-4 rounded-xl text-center bg-green-900/50 border border-green-500 text-green-200";
        document.getElementById('resultTitle').innerText = "🟢 " + team.team_name + " eingecheckt!";
        document.getElementById('resultDetails').innerText = `Spieler: ${team.player_count} | U18: ${team.has_underage ? 'JA ⚠️' : 'Nein'}`;
      }

      input.value = ""; // Feld leeren
      input.focus();   // Fokus sofort wieder aufs Eingabefeld setzen für den nächsten Scan
      loadTeams();
    }

    async function loadTeams() {
      const { data: teams } = await supabase.from('teams').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('teamList');
      
      if (!teams || teams.length === 0) {
        list.innerHTML = '<li class="text-xs text-gray-500">Noch keine Teams vorhanden.</li>';
        return;
      }

      list.innerHTML = teams.map(t => `
        <li class="p-3 bg-gray-700/50 rounded-lg border border-gray-600 flex justify-between items-center text-xs">
          <div>
            <span class="font-bold text-white">${t.team_name}</span> 
            <span class="text-gray-400">(${t.team_code})</span>
          </div>
          <span class="${t.checked_in ? 'text-green-400 font-bold' : 'text-gray-400'}">
            ${t.checked_in ? '🟢 Anwesend' : '🔴 Nicht da'}
          </span>
        </li>
      `).join('');
    }

    loadTeams();
  </script>
</body>
</html>
