<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Live Realtime Turnierbaum</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { dark: '#080A0F', card: '#131926', gold: '#F59E0B', emerald: '#10B981', pink: '#EC4899' }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #080A0F;
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(19, 25, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel-gold {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(19, 25, 38, 0.85) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.25);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF 30%, #FBBF24 70%, #F59E0B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-button {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }
    .gold-button:hover {
      background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.5);
    }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #080A0F; }
    ::-webkit-scrollbar-thumb { background: #1F293D; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F59E0B; }
  </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased">

  <div class="max-w-[1750px] mx-auto space-y-8">
    
    <!-- HEADER -->
    <header class="glass-panel rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-10 -left-10 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="space-y-1 text-center md:text-left z-10">
        <div class="flex items-center justify-center md:justify-start gap-3">
          <span class="px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase bg-amber-500/10 text-amber-400 border border-amber-500/20">
            REALTIME DYNAMISCHER TURNIERBAUM
          </span>
        </div>
        <h1 class="text-3xl md:text-5xl font-black tracking-tight uppercase gold-gradient-text">
          BOLZPLATZTOUR STR
        </h1>
        <p class="text-slate-400 text-xs md:text-sm font-semibold tracking-wide">
          KEINE FREILOSE • ECHTZEIT-SYNCHRONISATION MIT SUPABASE
        </p>
      </div>

      <div class="flex flex-wrap gap-3 z-10 w-full md:w-auto justify-center">
        <button onclick="createNewMatchModal()" class="gold-button text-slate-950 px-6 py-3.5 rounded-2xl text-xs font-black uppercase tracking-wider transition-all transform active:scale-95 flex items-center gap-2">
          <span>➕</span>
          <span>Neues Match Anlegen</span>
        </button>
      </div>
    </header>

    <!-- STATUS DASHBOARD -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-amber-500">
        <div>
          <span class="text-slate-400 text-[11px] uppercase font-bold tracking-wider block">ANZAHL MATCHES</span>
          <span id="matchCountDisplay" class="text-2xl font-black text-white mt-1 block">0</span>
        </div>
        <div class="text-3xl bg-amber-500/10 p-3 rounded-xl border border-amber-500/20">⚔️</div>
      </div>

      <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-emerald-500">
        <div>
          <span class="text-slate-400 text-[11px] uppercase font-bold tracking-wider block">REALTIME STATUS</span>
          <span id="realtimeStatus" class="text-2xl font-black text-emerald-400 mt-1 block flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span> VERBUNDEN
          </span>
        </div>
        <div class="text-3xl bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20">📡</div>
      </div>

      <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-pink-500">
        <div>
          <span class="text-slate-400 text-[11px] uppercase font-bold tracking-wider block">MODUS</span>
          <span class="text-sm font-extrabold text-pink-400 mt-1 block">Dynamische Erweiterung</span>
        </div>
        <div class="text-3xl bg-pink-500/10 p-3 rounded-xl border border-pink-500/20">🏆</div>
      </div>
    </div>

    <!-- KO-BAUM CONTAINER -->
    <div class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
        <h2 class="text-lg font-black uppercase tracking-wider text-slate-200 flex items-center gap-2">
          <span>🏆</span> LIVE TURNIERBAUM
        </h2>
        <span class="text-xs font-semibold text-slate-500">Ergebnisse ändern sich sofort live beim Eintragen</span>
      </div>

      <div class="overflow-x-auto pb-4">
        <div id="treeGrid" class="flex gap-8 min-w-[1000px] justify-start items-stretch"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: MATCH EDITIEREN ODER NEU ANLEGEN -->
  <div id="matchModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-all">
    <div class="glass-panel border border-slate-700/80 p-6 md:p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl relative">
      <div class="text-center space-y-1">
        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">SUPABASE LIVE EDIT</span>
        <h3 class="text-xl font-black text-white uppercase pt-2" id="modalTitle">Match bearbeiten</h3>
      </div>
      
      <div class="space-y-4">
        <!-- RUNDENAUSWAHL -->
        <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 space-y-1">
          <label class="text-[11px] font-bold text-slate-400 uppercase block">Runde / Ebene</label>
          <select id="modalRoundNumber" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-white focus:outline-none focus:border-amber-500">
            <option value="1">Runde 1 (Vorrunde)</option>
            <option value="2">Runde 2 (Achtelfinale)</option>
            <option value="3">Runde 3 (Viertelfinale)</option>
            <option value="4">Runde 4 (Halbfinale)</option>
            <option value="5">Runde 5 (FINALE)</option>
          </select>
        </div>

        <!-- TEAM A -->
        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-2">
          <label class="text-xs font-bold text-slate-400 uppercase block">Team A (Oben)</label>
          <div class="flex gap-2">
            <input type="text" id="modalTeamA" placeholder="Name Team A" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-white focus:outline-none focus:border-amber-500">
            <input type="number" id="modalScoreA" min="0" placeholder="0" class="w-16 bg-slate-800 border border-slate-700 rounded-xl py-2 text-center text-xl font-black text-amber-400 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="text-center font-black text-xs text-slate-600 tracking-widest uppercase">VS</div>

        <!-- TEAM B -->
        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-2">
          <label class="text-xs font-bold text-slate-400 uppercase block">Team B (Unten)</label>
          <div class="flex gap-2">
            <input type="text" id="modalTeamB" placeholder="Name Team B" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-white focus:outline-none focus:border-amber-500">
            <input type="number" id="modalScoreB" min="0" placeholder="0" class="w-16 bg-slate-800 border border-slate-700 rounded-xl py-2 text-center text-xl font-black text-amber-400 focus:outline-none focus:border-amber-500">
          </div>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="closeModal()" class="flex-1 glass-panel hover:bg-slate-800 text-slate-400 font-bold py-3 rounded-2xl text-xs uppercase tracking-wider transition-all">Abbrechen</button>
        <button onclick="saveMatchToSupabase()" class="flex-1 gold-button text-slate-950 font-black py-3 rounded-2xl text-xs uppercase tracking-wider transition-all">In Supabase Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMatches = [];
    let editingMatchId = null;

    // INITIALISIERUNG
    async function init() {
      await fetchMatches();
      subscribeToRealtime();
    }

    // 1. MATCHES AUS SUPABASE LADEN
    async function fetchMatches() {
      const { data, error } = await db
        .from('matches')
        .select('*')
        .order('round_number', { ascending: true })
        .order('match_number', { ascending: true });

      if (error) {
        console.error("Fehler beim Laden:", error);
        return;
      }

      allMatches = data || [];
      document.getElementById('matchCountDisplay').innerText = allMatches.length;
      renderTree();
    }

    // 2. SUPABASE REALTIME SUBSCRIPTION (Kein Neuladen nötig!)
    function subscribeToRealtime() {
      db.channel('public:matches')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, payload => {
          console.log("Realtime Update empfangen:", payload);
          fetchMatches();
        })
        .subscribe((status) => {
          const statusElem = document.getElementById('realtimeStatus');
          if (status === 'SUBSCRIBED') {
            statusElem.innerHTML = `<span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span> VERBUNDEN`;
            statusElem.className = "text-2xl font-black text-emerald-400 mt-1 block flex items-center gap-2";
          } else {
            statusElem.innerText = "VERBINDET...";
            statusElem.className = "text-2xl font-black text-amber-400 mt-1 block";
          }
        });
    }

    // 3. TURNIERBAUM RENDERN (Dynamisch ohne Freilose)
    function renderTree() {
      const treeGrid = document.getElementById('treeGrid');
      treeGrid.innerHTML = '';

      if (allMatches.length === 0) {
        treeGrid.innerHTML = `
          <div class="glass-panel p-8 rounded-3xl text-center max-w-md mx-auto space-y-4 my-8 border border-slate-700/50 w-full">
            <div class="text-5xl">⚡</div>
            <h3 class="text-xl font-black text-white uppercase tracking-wider">Keine Matches in Supabase</h3>
            <p class="text-slate-400 text-xs leading-relaxed">
              Trage Spiele direkt in deiner Supabase-Datenbank ein oder klicke oben auf <strong>"Neues Match Anlegen"</strong>.
            </p>
          </div>`;
        return;
      }

      // Gruppieren nach Runden
      const roundsMap = {};
      allMatches.forEach(m => {
        const r = m.round_number || 1;
        if (!roundsMap[r]) roundsMap[r] = [];
        roundsMap[r].push(m);
      });

      const roundNames = {
        1: "Runde 1",
        2: "Achtelfinale",
        3: "Viertelfinale",
        4: "Halbfinale",
        5: "FINALE 🏆"
      };

      Object.keys(roundsMap).sort((a,b) => a - b).forEach(rNum => {
        const roundColumn = document.createElement('div');
        roundColumn.className = "flex-1 min-w-[260px] flex flex-col justify-around bg-slate-900/40 p-4 rounded-3xl border border-slate-800/80 space-y-4";

        const title = roundNames[rNum] || `Runde ${rNum}`;
        roundColumn.innerHTML = `
          <h3 class="text-center text-[11px] font-black uppercase text-amber-400 tracking-widest bg-slate-900/90 py-2.5 rounded-xl border border-slate-800 shadow-inner mb-2">
            ${title}
          </h3>
        `;

        roundsMap[rNum].forEach(match => {
          roundColumn.appendChild(createMatchCard(match));
        });

        treeGrid.appendChild(roundColumn);
      });
    }

    // 4. MATCH CARD ERSTELLEN
    function createMatchCard(m) {
      const card = document.createElement('div');
      const hasWinner = m.winner !== null && m.winner !== undefined && m.winner !== '';

      card.className = `glass-panel hover:border-amber-500/60 transition-all duration-300 rounded-2xl p-4 shadow-lg space-y-3 cursor-pointer group hover:scale-[1.02] ${hasWinner ? 'border-amber-500/30' : ''}`;
      card.onclick = () => openEditModal(m);

      const teamA = m.team_a || m.player1_name || 'TBD';
      const teamB = m.team_b || m.player2_name || 'TBD';
      const scoreA = m.score_a !== undefined && m.score_a !== null ? m.score_a : (m.score1 !== undefined ? m.score1 : '-');
      const scoreB = m.score_b !== undefined && m.score_b !== null ? m.score_b : (m.score2 !== undefined ? m.score2 : '-');

      card.innerHTML = `
        <div class="flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-wider">
          <span>MATCH #${m.match_number || m.id.substring(0, 4)}</span>
          ${hasWinner ? '<span class="text-amber-400 font-black bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">BEENDET</span>' : '<span class="group-hover:text-amber-400 transition-colors">✎ BEARBEITEN</span>'}
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center text-sm font-extrabold ${m.winner === teamA ? 'text-amber-400' : 'text-slate-200'}">
            <span class="truncate pr-2">${teamA}</span>
            <span class="text-xs bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 font-mono ${m.winner === teamA ? 'border-amber-500/40 text-amber-400' : ''}">${scoreA}</span>
          </div>

          <div class="border-t border-slate-800/80"></div>

          <div class="flex justify-between items-center text-sm font-extrabold ${m.winner === teamB ? 'text-amber-400' : 'text-slate-200'}">
            <span class="truncate pr-2">${teamB}</span>
            <span class="text-xs bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 font-mono ${m.winner === teamB ? 'border-amber-500/40 text-amber-400' : ''}">${scoreB}</span>
          </div>
        </div>
      `;

      return card;
    }

    // MODAL OEFFNEN: BEARBEITEN
    function openEditModal(m) {
      editingMatchId = m.id;
      document.getElementById('modalTitle').innerText = `Match #${m.match_number || ''} bearbeiten`;
      document.getElementById('modalRoundNumber').value = m.round_number || 1;
      document.getElementById('modalTeamA').value = m.team_a || m.player1_name || '';
      document.getElementById('modalTeamB').value = m.team_b || m.player2_name || '';
      document.getElementById('modalScoreA').value = m.score_a !== undefined ? m.score_a : (m.score1 || 0);
      document.getElementById('modalScoreB').value = m.score_b !== undefined ? m.score_b : (m.score2 || 0);

      document.getElementById('matchModal').classList.remove('hidden');
    }

    // MODAL OEFFNEN: NEUES MATCH
    function createNewMatchModal() {
      editingMatchId = null;
      document.getElementById('modalTitle').innerText = "Neues Match Anlegen";
      document.getElementById('modalRoundNumber').value = 1;
      document.getElementById('modalTeamA').value = '';
      document.getElementById('modalTeamB').value = '';
      document.getElementById('modalScoreA').value = '';
      document.getElementById('modalScoreB').value = '';

      document.getElementById('matchModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('matchModal').classList.add('hidden');
    }

    // 5. IN SUPABASE SPEICHERN (UPDATE ODER INSERT)
    async function saveMatchToSupabase() {
      const roundNum = parseInt(document.getElementById('modalRoundNumber').value) || 1;
      const teamA = document.getElementById('modalTeamA').value.trim();
      const teamB = document.getElementById('modalTeamB').value.trim();
      const scoreAVal = document.getElementById('modalScoreA').value;
      const scoreBVal = document.getElementById('modalScoreB').value;

      const scoreA = scoreAVal !== "" ? parseInt(scoreAVal) : null;
      const scoreB = scoreBVal !== "" ? parseInt(scoreBVal) : null;

      let winner = null;
      let loser = null;

      if (scoreA !== null && scoreB !== null && teamA && teamB) {
        if (scoreA > scoreB) { winner = teamA; loser = teamB; }
        else if (scoreB > scoreA) { winner = teamB; loser = teamA; }
      }

      const matchData = {
        round_number: roundNum,
        team_a: teamA,
        team_b: teamB,
        player1_name: teamA,
        player2_name: teamB,
        score_a: scoreA,
        score_b: scoreB,
        score1: scoreA,
        score2: scoreB,
        winner: winner,
        winner_name: winner,
        loser: loser
      };

      if (editingMatchId) {
        // Update bestehendes Match
        const { error } = await db.from('matches').update(matchData).eq('id', editingMatchId);
        if (error) alert("Fehler beim Speichern: " + error.message);
      } else {
        // Neues Match einfügen
        matchData.match_number = allMatches.length + 1;
        const { error } = await db.from('matches').insert([matchData]);
        if (error) alert("Fehler beim Anlegen: " + error.message);
      }

      closeModal();
      fetchMatches();
    }

    // Starten
    init();
  </script>
</body>
</html>
