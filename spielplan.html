<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - King of the Hill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fcfbf7] text-gray-900 min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-3xl w-full space-y-6">
    <header class="text-center py-4 border-b border-stone-200">
      <h1 class="text-3xl font-black text-pink-500 uppercase tracking-wider">Gewinner Bleibt</h1>
      <p class="text-stone-500 text-xs mt-1">3 Siege in Folge = Endrunde | Niederlage/Remis = K.O.</p>
    </header>

    <div class="flex gap-4 justify-center">
      <button onclick="startTournament()" class="bg-pink-500 hover:bg-pink-600 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition-all shadow-md cursor-pointer">
        🎲 Turnier Starten / Zurücksetzen
      </button>
      <button onclick="loadDashboard()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold px-4 py-2 rounded-xl text-xs border border-stone-300 transition-all cursor-pointer">
        🔄 Aktualisieren
      </button>
    </div>

    <!-- QUALIFIZIERTE TEAMS -->
    <section class="bg-emerald-50 p-5 rounded-2xl border border-emerald-200 shadow-sm">
      <h2 class="text-lg font-bold text-emerald-700 uppercase tracking-wider mb-2">⭐ Qualifiziert für die Endrunde (3 Siege in Folge)</h2>
      <ul id="qualifiedList" class="list-disc list-inside text-sm font-bold text-emerald-900 space-y-1">
        <li class="text-stone-400 font-normal">Noch kein Team qualifiziert.</li>
      </ul>
    </section>

    <!-- AKTUELLES SPIEL -->
    <section class="bg-white p-6 rounded-2xl border-2 border-pink-500 shadow-xl">
      <h2 class="text-lg font-bold text-pink-600 uppercase tracking-wider mb-4 text-center">⚔️ Aktuelles Match</h2>
      <div id="currentMatchContainer">
        <p class="text-center text-stone-400 text-sm">Lade match...</p>
      </div>
    </section>

    <!-- ELIMINIERTE TEAMS -->
    <section class="bg-white p-5 rounded-2xl border border-stone-200 shadow-xl">
      <h2 class="text-sm font-bold text-rose-600 uppercase tracking-wider mb-3">💀 Ausgeschiedene Teams</h2>
      <div id="eliminatedContainer" class="flex flex-wrap gap-2 text-xs">
        <span class="text-stone-400">Keine.</span>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDashboard() {
      const { data: teams } = await db.from('teams').select('*').order('id', { ascending: true });
      const { data: matches } = await db.from('matches').select('*').order('id', { ascending: true });

      if (!teams || teams.length === 0) return;

      const teamMap = {};
      teams.forEach(t => teamMap[t.id] = t);

      // Berechne den aktuellen Turnier-Status
      const qualified = [];
      const eliminated = new Set();
      const currentStreak = {}; // Team-ID -> Siege in Folge

      teams.forEach(t => currentStreak[t.id] = 0);

      let currentMatch = null;

      (matches || []).forEach(m => {
        if (m.is_finished) {
          const t1 = m.team1_id;
          const t2 = m.team2_id;

          if (m.score_team1 > m.score_team2) {
            // Team 1 gewinnt
            currentStreak[t1] = (currentStreak[t1] || 0) + 1;
            eliminated.add(t2);

            if (currentStreak[t1] === 3) {
              qualified.push(teamMap[t1]);
            }
          } else if (m.score_team2 > m.score_team1) {
            // Team 2 gewinnt
            currentStreak[t2] = (currentStreak[t2] || 0) + 1;
            eliminated.add(t1);

            if (currentStreak[t2] === 3) {
              qualified.push(teamMap[t2]);
            }
          } else {
            // UNENTSCHIEDEN -> Beide Raus!
            eliminated.add(t1);
            eliminated.add(t2);
          }
        } else {
          currentMatch = m;
        }
      });

      renderQualified(qualified);
      renderEliminated(eliminated, teamMap);
      renderCurrentMatch(currentMatch, teamMap, currentStreak, teams, eliminated, qualified, matches || []);
    }

    function renderQualified(qualified) {
      const list = document.getElementById('qualifiedList');
      if (qualified.length === 0) {
        list.innerHTML = '<li class="text-stone-400 font-normal">Noch kein Team qualifiziert.</li>';
        return;
      }
      list.innerHTML = qualified.map(t => `<li>🎉 ${t.team_name} (Kapitän: ${t.captain_info})</li>`).join('');
    }

    function renderEliminated(eliminatedSet, teamMap) {
      const container = document.getElementById('eliminatedContainer');
      if (eliminatedSet.size === 0) {
        container.innerHTML = '<span class="text-stone-400">Keine.</span>';
        return;
      }
      const names = Array.from(eliminatedSet).map(id => teamMap[id] ? teamMap[id].team_name : `Team ${id}`);
      container.innerHTML = names.map(n => `<span class="bg-rose-100 text-rose-800 px-2.5 py-1 rounded-lg border border-rose-200 font-semibold">${n}</span>`).join('');
    }

    function renderCurrentMatch(match, teamMap, currentStreak, teams, eliminated, qualified, allMatches) {
      const container = document.getElementById('currentMatchContainer');

      if (!match) {
        container.innerHTML = `
          <div class="text-center space-y-3">
            <p class="text-stone-500 font-medium">Kein aktives Spiel. Nächstes Spiel vorbereiten?</p>
            <button onclick="nextMatch()" class="bg-pink-500 hover:bg-pink-600 text-white font-extrabold px-6 py-3 rounded-xl text-sm transition-all shadow-md cursor-pointer">
              ▶️ Nächstes Match aufrufen
            </button>
          </div>
        `;
        return;
      }

      const t1 = teamMap[match.team1_id];
      const t2 = teamMap[match.team2_id];

      const streak1 = currentStreak[t1.id] || 0;

      container.innerHTML = `
        <div class="flex flex-col items-center gap-4">
          <div class="flex items-center justify-between w-full text-base font-bold">
            <div class="text-center w-5/12">
              <span class="text-lg text-gray-900 block">${t1 ? t1.team_name : 'Team 1'}</span>
              <span class="text-xs text-pink-600 font-normal">🔥 ${streak1} Siege in Folge</span>
            </div>

            <div class="text-xl font-black text-stone-300">VS</div>

            <div class="text-center w-5/12">
              <span class="text-lg text-gray-900 block">${t2 ? t2.team_name : 'Team 2'}</span>
              <span class="text-xs text-stone-400 font-normal">Herausforderer</span>
            </div>
          </div>

          <div class="flex gap-2 items-center bg-stone-50 px-4 py-2 rounded-xl border border-stone-200 my-2">
            <input type="number" id="s1" placeholder="0" class="w-12 text-center text-2xl font-mono font-bold text-pink-600 bg-transparent focus:outline-none">
            <span class="text-xl font-bold text-stone-400">:</span>
            <input type="number" id="s2" placeholder="0" class="w-12 text-center text-2xl font-mono font-bold text-pink-600 bg-transparent focus:outline-none">
          </div>

          <button onclick="saveCurrentMatch(${match.id})" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-3 rounded-xl text-sm transition-all shadow-md cursor-pointer">
            💾 Ergebnis Speichern & Nächstes Spiel
          </button>
        </div>
      `;
    }

    async function saveCurrentMatch(matchId) {
      const s1 = parseInt(document.getElementById('s1').value);
      const s2 = parseInt(document.getElementById('s2').value);

      if (isNaN(s1) || isNaN(s2)) {
        alert("Bitte trage für beide Teams das Ergebnis ein!");
        return;
      }

      // 1. Ergebnis eintragen
      await db.from('matches').update({
        score_team1: s1,
        score_team2: s2,
        is_finished: true
      }).eq('id', matchId);

      // 2. Direkt nächstes Match aufrufen
      await nextMatch();
    }

    async function nextMatch() {
      const { data: teams } = await db.from('teams').select('*').eq('checked_in', true).order('id', { ascending: true });
      const { data: matches } = await db.from('matches').select('*').order('id', { ascending: true });

      if (!teams || teams.length < 2) {
        alert("Es sind nicht genug Teams eingecheckt!");
        return;
      }

      const teamMap = {};
      teams.forEach(t => teamMap[t.id] = t);

      const eliminated = new Set();
      const qualified = new Set();
      const currentStreak = {};
      teams.forEach(t => currentStreak[t.id] = 0);

      let lastMatch = null;

      (matches || []).forEach(m => {
        if (m.is_finished) {
          lastMatch = m;
          const t1 = m.team1_id;
          const t2 = m.team2_id;

          if (m.score_team1 > m.score_team2) {
            currentStreak[t1] = (currentStreak[t1] || 0) + 1;
            eliminated.add(t2);
            if (currentStreak[t1] === 3) qualified.add(t1);
          } else if (m.score_team2 > m.score_team1) {
            currentStreak[t2] = (currentStreak[t2] || 0) + 1;
            eliminated.add(t1);
            if (currentStreak[t2] === 3) qualified.add(t2);
          } else {
            // Unentschieden -> Beide raus
            eliminated.add(t1);
            eliminated.add(t2);
          }
        }
      });

      // Bestimme King (Wer bleibt auf dem Platz?)
      let kingId = null;
      if (lastMatch && lastMatch.is_finished) {
        if (lastMatch.score_team1 > lastMatch.score_team2 && !qualified.has(lastMatch.team1_id)) {
          kingId = lastMatch.team1_id;
        } else if (lastMatch.score_team2 > lastMatch.score_team1 && !qualified.has(lastMatch.team2_id)) {
          kingId = lastMatch.team2_id;
        }
      }

      // Welches ist das nächste freie Team, das noch nicht gespielt/eliminiert/qualifiziert ist?
      const availableTeams = teams.filter(t => !eliminated.has(t.id) && !qualified.has(t.id) && t.id !== kingId);

      if (availableTeams.length === 0 && !kingId) {
        alert("Keine weiteren Teams verfügbar! Vorrunde ist beendet.");
        loadDashboard();
        return;
      }

      let team1Id, team2Id;

      if (kingId) {
        team1Id = kingId;
        team2Id = availableTeams[0]?.id;
      } else {
        team1Id = availableTeams[0]?.id;
        team2Id = availableTeams[1]?.id;
      }

      if (!team1Id || !team2Id) {
        alert("Kein weiteres Match möglich (zu wenige verfügbare Teams)!");
        loadDashboard();
        return;
      }

      await db.from('matches').insert([
        {
          round: 'King of the Hill',
          team1_id: team1Id,
          team2_id: team2Id,
          is_finished: false
        }
      ]);

      loadDashboard();
    }

    async function startTournament() {
      if (!confirm("Möchtest du das Turnier neu starten? Alle bisherigen Spiele werden gelöscht!")) return;

      await db.from('matches').delete().neq('id', 0);
      await nextMatch();
    }

    loadDashboard();
  </script>
</body>
</html>
