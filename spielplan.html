<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Live Spielplan & Ergebnis-Eingabe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-900 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-[1600px] mx-auto">
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-stone-800 gap-4">
      <div>
        <h1 class="text-3xl font-black text-pink-500 uppercase tracking-wider">BOLZPLATZTOUR STR</h1>
        <p class="text-stone-400 text-sm">Gemeinsamer Turnierbaum • Frauen top-seeded</p>
      </div>

      <div class="flex gap-3">
        <button onclick="loadTournament()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-xl text-xs font-black transition-all shadow-lg flex items-center gap-2">
          🔄 Baum Aktualisieren
        </button>
      </div>
    </header>

    <!-- STATUS BAR -->
    <div class="bg-stone-800/80 border border-stone-700 rounded-2xl p-4 mb-6 flex flex-wrap justify-between items-center gap-4 shadow-xl">
      <div>
        <span class="text-stone-400 text-xs uppercase font-bold block">Alle Teams im Turnier</span>
        <span id="teamCountDisplay" class="text-xl font-black text-pink-400">Lädt...</span>
      </div>
      <div>
        <span class="text-stone-400 text-xs uppercase font-bold block">Turniergröße</span>
        <span id="phaseDisplay" class="text-xl font-black text-white">-</span>
      </div>
      <div class="text-xs text-stone-400 max-w-xs">
        💡 <strong class="text-pink-400">Hinweis:</strong> Klicke auf ein Match, um den Endstand einzutragen. Der Sieger wird automatisch weitergeleitet!
      </div>
    </div>

    <!-- KO-BAUM CONTAINER -->
    <div class="overflow-x-auto pb-8">
      <div id="treeGrid" class="flex gap-6 min-w-[900px] justify-start items-stretch">
        <!-- Wird dynamisch per JS befüllt -->
      </div>
    </div>
  </div>

  <!-- MODAL: ERGEBNIS EINTRAGEN -->
  <div id="scoreModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-stone-800 border border-stone-700 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-black text-pink-500 uppercase tracking-wider text-center" id="modalMatchTitle">Ergebnis eintragen</h3>
      
      <div class="space-y-3 pt-2">
        <div>
          <label class="block text-xs font-bold text-stone-300 mb-1" id="labelTeamA">Team 1 Score</label>
          <input type="number" id="scoreA" min="0" value="0" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-2 text-center text-xl font-black text-white focus:outline-none focus:border-pink-500">
        </div>
        <div class="text-center font-black text-stone-500">VS</div>
        <div>
          <label class="block text-xs font-bold text-stone-300 mb-1" id="labelTeamB">Team 2 Score</label>
          <input type="number" id="scoreB" min="0" value="0" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-2 text-center text-xl font-black text-white focus:outline-none focus:border-pink-500">
        </div>
      </div>

      <div class="flex gap-2 pt-3">
        <button onclick="closeModal()" class="flex-1 bg-stone-700 hover:bg-stone-600 text-stone-200 font-bold py-2.5 rounded-xl text-xs transition-all">Abbrechen</button>
        <button onclick="saveScore()" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-black py-2.5 rounded-xl text-xs transition-all shadow-md">Speichern & Weiter</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // In-Memory Speicher für Match-Ergebnisse im aktuellen Baum
    let tournamentTreeState = {};
    let currentEditingMatch = null;

    async function loadTournament() {
      const treeGrid = document.getElementById('treeGrid');
      treeGrid.innerHTML = `<div class="text-stone-400 text-sm">Berechne gemischten Turnierbaum...</div>`;

      // 1. Alle Teams (Männer & Frauen) holen
      const { data: teams, error } = await db.from('teams').select('*');

      if (error || !teams) {
        treeGrid.innerHTML = `<div class="text-red-400 text-sm">Fehler beim Laden der Teams.</div>`;
        return;
      }

      const count = teams.length;
      document.getElementById('teamCountDisplay').innerText = `${count} Teams gesamt`;

      if (count < 2) {
        treeGrid.innerHTML = `<div class="text-stone-500 italic text-sm">Mindestens 2 Teams erforderlich.</div>`;
        document.getElementById('phaseDisplay').innerText = "Wartet auf Anmeldungen";
        return;
      }

      // Frauen zuerst sortieren (alle F... Teams nach oben, M... nach unten)
      const femaleTeams = teams.filter(t => t.team_name.startsWith('F'));
      const maleTeams = teams.filter(t => t.team_name.startsWith('M'));
      const sortedTeams = [...femaleTeams, ...maleTeams];

      // 2. Baumgröße festlegen
      let treeSize = 2;
      if (count > 16) treeSize = 32;
      else if (count > 8) treeSize = 16;
      else if (count > 4) treeSize = 8;
      else if (count > 2) treeSize = 4;
      else treeSize = 2;

      let startName = "";
      if (treeSize === 32) startName = "1/16-Finale";
      else if (treeSize === 16) startName = "Achtelfinale";
      else if (treeSize === 8) startName = "Viertelfinale";
      else if (treeSize === 4) startName = "Halbfinale";
      else startName = "FINALE";

      document.getElementById('phaseDisplay').innerText = `${treeSize}er Baum (${femaleTeams.length} Frauen- & ${maleTeams.length} Herren-Teams)`;

      treeGrid.innerHTML = '';

      // 3. Erstes Runden-Feld initialisieren
      let currentSize = treeSize;
      let roundIndex = 0;

      while (currentSize >= 2) {
        let roundTitle = "";
        if (currentSize === 32) roundTitle = "1/16-Finale";
        else if (currentSize === 16) roundTitle = "Achtelfinale";
        else if (currentSize === 8) roundTitle = "Viertelfinale";
        else if (currentSize === 4) roundTitle = "Halbfinale";
        else if (currentSize === 2) roundTitle = "FINALE 🏆";

        const col = createColumn(roundTitle);
        const matchCount = currentSize / 2;

        for (let m = 0; m < matchCount; m++) {
          const matchId = `r${roundIndex}_m${m}`;
          
          let teamA = "Gewinner";
          let teamB = "Gewinner";

          if (roundIndex === 0) {
            teamA = sortedTeams[m * 2] ? sortedTeams[m * 2].team_name : " Offen";
            teamB = sortedTeams[m * 2 + 1] ? sortedTeams[m * 2 + 1].team_name : " Offen";

            // State im Speicher anlegen falls neu
            if (!tournamentTreeState[matchId]) {
              tournamentTreeState[matchId] = { teamA, teamB, scoreA: null, scoreB: null, winner: null };
            } else {
              tournamentTreeState[matchId].teamA = teamA;
              tournamentTreeState[matchId].teamB = teamB;
            }
          } else {
            // Folgerunden: Sieger aus vorherigen Matches holen
            const prevMatchA = tournamentTreeState[`r${roundIndex-1}_m${m*2}`];
            const prevMatchB = tournamentTreeState[`r${roundIndex-1}_m${m*2+1}`];

            teamA = prevMatchA && prevMatchA.winner ? prevMatchA.winner : `Sieger M${m * 2 + 1}`;
            teamB = prevMatchB && prevMatchB.winner ? prevMatchB.winner : `Sieger M${m * 2 + 2}`;

            if (!tournamentTreeState[matchId]) {
              tournamentTreeState[matchId] = { teamA, teamB, scoreA: null, scoreB: null, winner: null };
            } else {
              tournamentTreeState[matchId].teamA = teamA;
              tournamentTreeState[matchId].teamB = teamB;
            }
          }

          col.appendChild(createMatchCard(matchId, roundIndex, m, roundTitle));
        }

        treeGrid.appendChild(col);
        currentSize /= 2;
        roundIndex++;
      }
    }

    function createColumn(title) {
      const col = document.createElement('div');
      col.className = "flex-1 min-w-[240px] flex flex-col justify-around bg-stone-800/40 p-3 rounded-2xl border border-stone-800";
      
      const header = document.createElement('h3');
      header.className = "text-center text-xs font-black uppercase text-pink-500 mb-4 bg-stone-800 py-2 rounded-xl border border-stone-700 tracking-wider shadow-inner";
      header.innerText = title;
      
      col.appendChild(header);
      return col;
    }

    function createMatchCard(matchId, rIndex, mIndex, roundTitle) {
      const match = tournamentTreeState[matchId];
      const card = document.createElement('div');
      card.className = "bg-stone-800 hover:border-pink-500/50 transition-all border border-stone-700 rounded-xl p-3 my-2 shadow-md space-y-2 cursor-pointer group";
      card.onclick = () => openScoreModal(matchId, roundTitle);

      const isFinished = match.winner !== null;

      card.innerHTML = `
        <div class="flex justify-between items-center text-[10px] font-bold text-stone-500 uppercase">
          <span>Spiel ${mIndex + 1}</span>
          ${isFinished ? '<span class="text-pink-400 font-black">BEENDET</span>' : '<span class="group-hover:text-pink-400">✎ Eintragen</span>'}
        </div>

        <div class="flex justify-between items-center text-sm font-bold ${match.winner === match.teamA ? 'text-pink-400 font-extrabold' : 'text-white'}">
          <span>${match.teamA}</span>
          <span class="text-xs bg-stone-900 px-2 py-0.5 rounded border border-stone-700 font-mono">${match.scoreA !== null ? match.scoreA : '-'}</span>
        </div>

        <div class="border-t border-stone-700/60 my-1"></div>

        <div class="flex justify-between items-center text-sm font-bold ${match.winner === match.teamB ? 'text-pink-400 font-extrabold' : 'text-white'}">
          <span>${match.teamB}</span>
          <span class="text-xs bg-stone-900 px-2 py-0.5 rounded border border-stone-700 font-mono">${match.scoreB !== null ? match.scoreB : '-'}</span>
        </div>
      `;

      return card;
    }

    function openScoreModal(matchId, roundTitle) {
      const match = tournamentTreeState[matchId];
      if (match.teamA.includes("Sieger") || match.teamB.includes("Sieger") || match.teamA === " Offen" || match.teamB === " Offen") {
        alert("Dieses Match steht noch nicht fest!");
        return;
      }

      currentEditingMatch = matchId;
      document.getElementById('modalMatchTitle').innerText = `${roundTitle}`;
      document.getElementById('labelTeamA').innerText = match.teamA;
      document.getElementById('labelTeamB').innerText = match.teamB;
      document.getElementById('scoreA').value = match.scoreA !== null ? match.scoreA : 0;
      document.getElementById('scoreB').value = match.scoreB !== null ? match.scoreB : 0;

      document.getElementById('scoreModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.add('hidden');
    }

    function saveScore() {
      if (!currentEditingMatch) return;

      const scoreA = parseInt(document.getElementById('scoreA').value) || 0;
      const scoreB = parseInt(document.getElementById('scoreB').value) || 0;

      if (scoreA === scoreB) {
        alert("Im K.o.-System muss es einen Sieger geben (kein Unentschieden)!");
        return;
      }

      const match = tournamentTreeState[currentEditingMatch];
      match.scoreA = scoreA;
      match.scoreB = scoreB;
      match.winner = scoreA > scoreB ? match.teamA : match.teamB;

      closeModal();
      loadTournament(); // Baum neu zeichnen & Sieger weiterleiten!
    }

    // Beim Aufruf laden
    loadTournament();
  </script>
</body>
</html>
