<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Live Spielplan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fcfbf7] text-gray-900 min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-3xl w-full space-y-6">
    <header class="text-center py-4 border-b border-stone-200">
      <h1 class="text-3xl font-black text-pink-500 uppercase tracking-wider">⚽ Live-Spielplan & Tabelle</h1>
      <p class="text-stone-500 text-xs mt-1">BolzplatzTour STR Turnier-Dashboard</p>
    </header>

    <div class="flex gap-4 justify-center">
      <button onclick="generateSchedule()" class="bg-pink-500 hover:bg-pink-600 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition-all shadow-md cursor-pointer">
        🎲 Spielplan automatisch auslosen
      </button>
      <button onclick="loadDashboard()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold px-4 py-2 rounded-xl text-xs border border-stone-300 transition-all cursor-pointer">
        🔄 Daten Aktualisieren
      </button>
    </div>

    <section class="bg-white p-5 rounded-2xl border border-stone-200 shadow-xl">
      <h2 class="text-lg font-bold text-pink-600 uppercase tracking-wider mb-4">🏆 Live-Tabelle</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="text-stone-500 border-b border-stone-200 text-xs uppercase">
              <th class="p-2">Platz</th>
              <th class="p-2">Team</th>
              <th class="p-2 text-center">Spiele</th>
              <th class="p-2 text-center">Tore</th>
              <th class="p-2 text-center font-bold text-pink-600">Punkte</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="p-4 text-center text-stone-400">Lade Tabelle...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="bg-white p-5 rounded-2xl border border-stone-200 shadow-xl">
      <h2 class="text-lg font-bold text-pink-600 uppercase tracking-wider mb-4">⚔️ Anstehende & Beendete Spiele</h2>
      <div id="matchesContainer" class="space-y-3">
        <p class="text-center text-stone-400 text-xs">Lade Spiele...</p>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDashboard() {
      const { data: teams } = await db.from('teams').select('*');
      const { data: matches } = await db.from('matches').select('*');

      renderTable(teams || [], matches || []);
      renderMatches(matches || [], teams || []);
    }

    function renderTable(teams, matches) {
      const stats = {};
      teams.forEach(t => {
        stats[t.id] = { name: t.team_name, played: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
      });

      matches.forEach(m => {
        if (m.is_finished && m.score_team1 !== null && m.score_team2 !== null) {
          const t1 = stats[m.team1_id];
          const t2 = stats[m.team2_id];

          if (t1 && t2) {
            t1.played++;
            t2.played++;
            t1.goalsFor += m.score_team1;
            t1.goalsAgainst += m.score_team2;
            t2.goalsFor += m.score_team2;
            t2.goalsAgainst += m.score_team1;

            if (m.score_team1 > m.score_team2) {
              t1.points += 3;
            } else if (m.score_team2 > m.score_team1) {
              t2.points += 3;
            } else {
              t1.points += 1;
              t2.points += 1;
            }
          }
        }
      });

      const sorted = Object.values(stats).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        const diffA = a.goalsFor - a.goalsAgainst;
        const diffB = b.goalsFor - b.goalsAgainst;
        return diffB - diffA;
      });

      const tbody = document.getElementById('tableBody');
      if (sorted.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-stone-400">Keine Teams gefunden.</td></tr>';
        return;
      }

      tbody.innerHTML = sorted.map((t, index) => `
        <tr class="border-b border-stone-100 hover:bg-stone-50">
          <td class="p-2 font-bold text-stone-400">#${index + 1}</td>
          <td class="p-2 font-bold text-gray-900">${t.name}</td>
          <td class="p-2 text-center">${t.played}</td>
          <td class="p-2 text-center font-mono">${t.goalsFor}:${t.goalsAgainst}</td>
          <td class="p-2 text-center font-bold text-pink-600">${t.points}</td>
        </tr>
      `).join('');
    }

    function renderMatches(matches, teams) {
      const container = document.getElementById('matchesContainer');
      const teamMap = {};
      teams.forEach(t => teamMap[t.id] = t.team_name);

      if (matches.length === 0) {
        container.innerHTML = '<p class="text-center text-stone-400 text-xs">Noch keine Spiele ausgelost.</p>';
        return;
      }

      container.innerHTML = matches.map(m => `
        <div class="bg-stone-50 p-4 rounded-xl border border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="text-xs text-stone-400 font-mono">${m.round || 'Vorrunde'}</div>
          <div class="flex items-center gap-3 text-sm font-bold w-full sm:w-auto justify-center">
            <span class="text-right w-32 truncate text-gray-900">${teamMap[m.team1_id] || 'Team 1'}</span>
            <div class="flex gap-1 items-center bg-white px-3 py-1 rounded-lg border border-stone-300">
              <input type="number" id="s1_${m.id}" value="${m.score_team1 ?? ''}" placeholder="0" class="w-10 bg-transparent text-center font-mono text-pink-600 font-bold focus:outline-none">
              <span class="text-stone-400">:</span>
              <input type="number" id="s2_${m.id}" value="${m.score_team2 ?? ''}" placeholder="0" class="w-10 bg-transparent text-center font-mono text-pink-600 font-bold focus:outline-none">
            </div>
            <span class="text-left w-32 truncate text-gray-900">${teamMap[m.team2_id] || 'Team 2'}</span>
          </div>
          <button onclick="saveScore(${m.id})" class="bg-pink-500 hover:bg-pink-600 text-white font-extrabold px-3 py-1 rounded-lg text-xs transition-all cursor-pointer">
            💾 Speichern
          </button>
        </div>
      `).join('');
    }

    async function saveScore(matchId) {
      const s1 = parseInt(document.getElementById(`s1_${matchId}`).value);
      const s2 = parseInt(document.getElementById(`s2_${matchId}`).value);

      if (isNaN(s1) || isNaN(s2)) {
        alert("Bitte trage für beide Teams Tore ein!");
        return;
      }

      await db.from('matches').update({
        score_team1: s1,
        score_team2: s2,
        is_finished: true
      }).eq('id', matchId);

      loadDashboard();
    }

    async function generateSchedule() {
      const { data: teams } = await db.from('teams').select('*').eq('checked_in', true);

      if (!teams || teams.length < 2) {
        alert("Es müssen mindestens 2 eingecheckte Teams anwesend sein, um einen Spielplan zu erstellen!");
        return;
      }

      if (!confirm("Achtung: Dies setzt den aktuellen Spielplan zurück. Fortfahren?")) return;

      await db.from('matches').delete().neq('id', 0);

      const newMatches = [];
      for (let i = 0; i < teams.length; i++) {
        for (let j = i + 1; j < teams.length; j++) {
          newMatches.push({
            round: 'Vorrunde',
            team1_id: teams[i].id,
            team2_id: teams[j].id,
            is_finished: false
          });
        }
      }

      await db.from('matches').insert(newMatches);
      loadDashboard();
    }

    loadDashboard();
  </script>
</body>
</html>
