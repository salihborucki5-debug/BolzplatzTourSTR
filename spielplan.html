<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolzplatzTour STR - Spielplan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-900 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto">
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 pb-4 border-b border-stone-800 gap-4">
      <div>
        <h1 class="text-3xl font-black text-pink-500 uppercase tracking-wider">BOLZPLATZTOUR STR</h1>
        <p class="text-stone-400 text-sm">Turnierbaum</p>
      </div>

      <!-- KATEGORIE SWITCHER (HERREN / FRAUEN) -->
      <div class="flex gap-2 bg-stone-800 p-1.5 rounded-xl border border-stone-700">
        <button onclick="switchCategory('M')" id="btnM" class="px-5 py-2 rounded-lg font-bold text-sm bg-pink-500 text-white transition-all">
          🚹 Herren
        </button>
        <button onclick="switchCategory('F')" id="btnF" class="px-5 py-2 rounded-lg font-bold text-sm text-stone-400 hover:text-white transition-all">
          🚺 Frauen
        </button>
      </div>
    </header>

    <!-- STATUS BAR -->
    <div class="bg-stone-800/80 border border-stone-700 rounded-xl p-4 mb-8 flex justify-between items-center">
      <div>
        <span class="text-stone-400 text-xs uppercase font-bold block">Angemeldete Teams</span>
        <span id="teamCountDisplay" class="text-xl font-bold text-pink-400">Lädt...</span>
      </div>
      <div>
        <span class="text-stone-400 text-xs uppercase font-bold block">Turnierbaum</span>
        <span id="phaseDisplay" class="text-xl font-bold text-white">-</span>
      </div>
      <button onclick="loadTournament()" class="bg-stone-700 hover:bg-stone-600 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
        🔄 Aktualisieren
      </button>
    </div>

    <!-- KO-BAUM CONTAINER -->
    <div class="overflow-x-auto pb-6">
      <div id="treeGrid" class="flex gap-6 min-w-[800px] justify-start items-stretch">
        <!-- Wird dynamisch per JS befüllt -->
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rsujqzvudncqrpdwikyr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9c2p0DsLdUh4K4wq3xYIHw_ah2wyOQu";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentCategory = 'M';

    function switchCategory(cat) {
      currentCategory = cat;
      const btnM = document.getElementById('btnM');
      const btnF = document.getElementById('btnF');

      if (cat === 'M') {
        btnM.className = "px-5 py-2 rounded-lg font-bold text-sm bg-pink-500 text-white transition-all";
        btnF.className = "px-5 py-2 rounded-lg font-bold text-sm text-stone-400 hover:text-white transition-all";
      } else {
        btnF.className = "px-5 py-2 rounded-lg font-bold text-sm bg-pink-500 text-white transition-all";
        btnM.className = "px-5 py-2 rounded-lg font-bold text-sm text-stone-400 hover:text-white transition-all";
      }
      loadTournament();
    }

    async function loadTournament() {
      const treeGrid = document.getElementById('treeGrid');
      treeGrid.innerHTML = `<div class="text-stone-400 text-sm">Lade Teams...</div>`;

      // Teams aus Supabase holen
      const { data: teams, error } = await db
        .from('teams')
        .select('*')
        .like('team_name', `${currentCategory}%`);

      if (error || !teams) {
        treeGrid.innerHTML = `<div class="text-red-400 text-sm">Fehler beim Laden der Teams.</div>`;
        return;
      }

      const count = teams.length;
      document.getElementById('teamCountDisplay').innerText = `${count} Teams`;

      if (count < 2) {
        treeGrid.innerHTML = `<div class="text-stone-500 italic text-sm">Mindestens 2 Teams erforderlich.</div>`;
        document.getElementById('phaseDisplay').innerText = "Wartet auf Anmeldungen";
        return;
      }

      // EXAKTE LOGIK FÜR TURNIERGRÖSSE:
      let treeSize = 2;
      if (count > 16) {
        treeSize = 32; // 17 - 32 Teams -> 32er Baum (Sechzehntelfinale)
      } else if (count > 8) {
        treeSize = 16; // 9 - 16 Teams -> 16er Baum (Achtelfinale)
      } else if (count > 4) {
        treeSize = 8;  // 5 - 8 Teams -> 8er Baum (Viertelfinale)
      } else if (count > 2) {
        treeSize = 4;  // 3 - 4 Teams -> 4er Baum (Halbfinale)
      } else {
        treeSize = 2;  // 2 Teams -> Direkt Finale
      }

      // Runden-Startbezeichnung
      let startName = "";
      if (treeSize === 32) startName = "1/16-Finale";
      else if (treeSize === 16) startName = "Achtelfinale";
      else if (treeSize === 8) startName = "Viertelfinale";
      else if (treeSize === 4) startName = "Halbfinale";
      else startName = "FINALE";

      document.getElementById('phaseDisplay').innerText = `${treeSize}er Baum (Start: ${startName})`;

      treeGrid.innerHTML = '';

      // Teams durchmischen für Auslosung
      let shuffled = [...teams].sort(() => Math.random() - 0.5);

      // KO-Baum generieren von der Startrunde bis zum Finale
      let currentSize = treeSize;
      let isFirstRound = true;

      while (currentSize >= 2) {
        let roundTitle = "";
        if (currentSize === 32) roundTitle = "1/16-Finale";
        else if (currentSize === 16) roundTitle = "Achtelfinale";
        else if (currentSize === 8) roundTitle = "Viertelfinale";
        else if (currentSize === 4) roundTitle = "Halbfinale";
        else if (currentSize === 2) roundTitle = "FINALE 🏆";

        const col = createColumn(roundTitle);
        const matchCount = currentSize / 2;

        for (let i = 0; i < matchCount; i++) {
          let teamA = `Sieger Spiel ${i * 2 + 1}`;
          let teamB = `Sieger Spiel ${i * 2 + 2}`;

          // In der 1. Runde befüllen wir echte Teams / Platzhalter wenn Plätze frei sind
          if (isFirstRound) {
            teamA = shuffled.length > 0 ? shuffled.pop().team_name : " Offen";
            teamB = shuffled.length > 0 ? shuffled.pop().team_name : " Offen";
          }

          col.appendChild(createMatchCard(teamA, teamB, `Spiel ${i + 1}`));
        }

        treeGrid.appendChild(col);
        currentSize /= 2;
        isFirstRound = false;
      }
    }

    function createColumn(title) {
      const col = document.createElement('div');
      col.className = "flex-1 min-w-[220px] flex flex-col justify-around bg-stone-800/40 p-3 rounded-2xl border border-stone-800";
      
      const header = document.createElement('h3');
      header.className = "text-center text-xs font-black uppercase text-pink-500 mb-4 bg-stone-800 py-2 rounded-xl border border-stone-700 tracking-wider";
      header.innerText = title;
      
      col.appendChild(header);
      return col;
    }

    function createMatchCard(teamA, teamB, label) {
      const card = document.createElement('div');
      card.className = "bg-stone-800 border border-stone-700 rounded-xl p-3 my-2 shadow-md space-y-2";

      const isAOpen = teamA === " Offen";
      const isBOpen = teamB === " Offen";

      card.innerHTML = `
        <div class="text-[10px] font-bold text-stone-500 uppercase">${label}</div>
        <div class="flex justify-between items-center text-sm font-bold ${isAOpen ? 'text-amber-400 italic font-normal' : 'text-white'}">
          <span>${teamA}</span>
          <span class="text-xs text-stone-500">-</span>
        </div>
        <div class="border-t border-stone-700/60 my-1"></div>
        <div class="flex justify-between items-center text-sm font-bold ${isBOpen ? 'text-amber-400 italic font-normal' : 'text-white'}">
          <span>${teamB}</span>
          <span class="text-xs text-stone-500">-</span>
        </div>
      `;

      return card;
    }

    loadTournament();
  </script>
</body>
</html>
